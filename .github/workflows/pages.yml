name: Pages

# Build the docs (mdBook) + assemble the static site, then deploy to GitHub
# Pages. The deploy job is gated on repository visibility: Pages is free for
# public repos, so while the repo is private the workflow stays green and
# skips deploy; the moment the repo goes public (or the workflow is re-run
# after that), the site publishes.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs-src/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.v.outputs.pub }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "pub=$(gh api repos/${{ github.repository }} --jq '.visibility=="public"')" >> "$GITHUB_OUTPUT"

  build:
    needs: [gates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Browser algorithms + Rust parity + documentation source checks
        run: |
          node --check site/algorithms.js
          node --check site/experiments.js
          node --check site/console.js
          node --test site/test/*.test.cjs
          python3 site/test/rust-parity.py
          python3 site/test/check-site.py
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: Build docs book
        run: |
          mkdir -p "$PWD/dist"
          mdbook build docs-src -d "$PWD/dist/docs"
      - name: Assemble site (landing + book)
        run: |
          mkdir -p dist
          cp site/*.html site/*.css site/*.js site/*.svg dist/
          python3 site/test/check-site.py --dist dist
      - name: Install isolated browser test tools (not shipped)
        run: |
          npm install --prefix "$RUNNER_TEMP/blackbox-webcheck" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 axe-core@4.11.0
          node "$RUNNER_TEMP/blackbox-webcheck/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Browser interactions, mobile, keyboard, and accessibility
        env:
          NODE_PATH: ${{ runner.temp }}/blackbox-webcheck/node_modules
        run: node site/test/browser-check.cjs dist
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [gates, build]
    if: needs.gates.outputs.public == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
